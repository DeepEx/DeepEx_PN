<!doctype html>
<html>
<head><meta charset="utf-8"><title>DeepEx Login</title></head>

{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:520px; margin:40px auto;">
  <div class="h1">Login</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field">
      <label>Username</label>
      <input name="username" required>
    </div>
    <br/>
    <div class="field">
      <label>Password</label>
      <input name="password" type="password" required>
    </div>
    <br/>
    <button class="btn primary" type="submit">Entra</button>
    <div class="help">Default: admin / admin (poi cambiamo)</div>
  </form>
</div>
{% endblock %}

<body>
  <h2>DeepEx – Login</h2>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username</label><br/>
    <input name="username" required><br/><br/>
    <label>Password</label><br/>
    <input name="password" type="password" required><br/><br/>
    <button type="submit">Entra</button>
  </form>
  <p style="font-size:12px;opacity:.7">Default: admin / admin (cambiare appena possibile)</p>
</body>
</html>
